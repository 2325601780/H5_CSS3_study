<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS</title>
</head>
<body>
    <button id="btn">发送请求</button>

    <script>
        // CORS：普通的 AJAX/fetch 请求，无需前端做特殊处理
        // 能否跨域成功，完全取决于后端响应头 Access-Control-Allow-Origin
        const btn = document.getElementById('btn')
        btn.onclick = function () {
            fetch('http://127.0.0.1:3000')
                .then(res => res.json())
                .then(data => console.log(data))   // {name: '张三', age: 18}
                .catch(err => console.log('请求失败：', err))
        }
    </script>
</body>
</html>
