<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        .item {
            width: 200px;
            height: 100px;
            float: left;
        }
        .item:nth-child(1) {
            background-color: red;
        }

        .item:nth-child(2) {
            background-color: yellow;
        }

        .item:nth-child(3) {
            background-color: blue;
        }
        ul{
            overflow: auto;
        }
    </style>
</head>

<body>
    <ul>
        <li class="item">1</li>
        <li class="item">2</li>
        <li class="item">3</li>
    </ul>
    <h2>hello world</h2>
</body>

</html>
