        <img width="200" src="https://img1.baidu.com/it/u=605409715,1997762149&fm=253&fmt=auto&app=138&f=JPEG?w=740&h=500" alt="失败">
        <p>
            盒模型是 CSS 布局的基础，浏览器会把页面中的每一个元素都看成一个矩形的盒子，盒子从内到外由四部分组成：

            content（内容区）：存放文本、图片等内容，由 width、height 控制大小
            padding（内边距）：内容与边框之间的距离，会被背景色填充
            border（边框）：盒子的边框，会占据空间
            margin（外边距）：盒子与其他盒子之间的距离，透明且不显示背景
